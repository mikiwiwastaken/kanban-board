<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <main class="app">
      <header class="header">
        <div>
          <span class="eyebrow">WORKSPACE / PROJECT</span>
          <h1>My Tasks</h1>
          <p class="subtitle">Manage your work and stay productive.</p>
        </div>

        <div class="header-actions">
          <button class="user-avatar" aria-label="User profile">M</button>
        </div>
      </header>

      <section class="board">
        <div class="board-toolbar">
          <button class="add-task-btn">
            <i class="fa-solid fa-plus"></i>
            Add a task
          </button>
        </div>

        <div class="board-columns">
          <section class="column" data-column-id="todo">
            <div class="column-header">
              <div class="column-title">
                <span class="status-dot todo-dot"></span>
                <h2>To Do</h2>
                <span class="task-count">0</span>
              </div>

              <button class="icon-btn" aria-label="More options">
                <i class="fa-solid fa-ellipsis"></i>
              </button>
            </div>

            <div class="task-list"></div>
          </section>

          <section class="column" data-column-id="doing">
            <div class="column-header">
              <div class="column-title">
                <span class="status-dot doing-dot"></span>
                <h2>Doing</h2>
                <span class="task-count">0</span>
              </div>

              <button class="icon-btn" aria-label="More options">
                <i class="fa-solid fa-ellipsis"></i>
              </button>
            </div>

            <div class="task-list"></div>
          </section>

          <section class="column" data-column-id="done">
            <div class="column-header">
              <div class="column-title">
                <span class="status-dot done-dot"></span>
                <h2>Done</h2>
                <span class="task-count">0</span>
              </div>

              <button class="icon-btn" aria-label="More options">
                <i class="fa-solid fa-ellipsis"></i>
              </button>
            </div>

            <div class="task-list"></div>
          </section>
        </div>
      </section>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
